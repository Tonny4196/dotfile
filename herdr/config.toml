onboarding = false

[theme]
# Ghostty 側の theme = TokyoNight と揃えている
name = "tokyo-night"
auto_switch = false

[keys]
# Prefix key (default: ctrl+b). Ghostty forwards cmd+b via the kitty keyboard protocol.
prefix = "cmd+b"
previous_workspace = "cmd+alt+up"
next_workspace = "cmd+alt+down"
previous_tab = "cmd+alt+left"
next_tab = "cmd+alt+right"

# 直接ショートカット（prefix不要）。Ghostty側で super+t / super+shift+t を unbind 済み。
new_workspace = "cmd+t"
new_tab = "cmd+shift+t"

[ui]
status_indicators = "symbols"

# Agents 一覧: 1行目に作業名（エージェントが設定するターミナルタイトル）、2行目にワークスペース/タブ/種別。
# Claude Code はセッション名、Codex は「タスク名 | ディレクトリ」をタイトルに出す。
[ui.sidebar.agents]
# デフォルトだと dim 表示で読みにくいので、TokyoNight の前景色で明示的に色を付ける。
rows = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#c0caf5", bold = true, dim = false }],
  [
    { token = "workspace", fg = "#7aa2f7", dim = false },
    { token = "tab", fg = "#a9b1d6", dim = false },
    { token = "agent", fg = "#737aa2", dim = false },
  ],
]

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"
